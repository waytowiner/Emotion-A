# 政策（时政）关键词词典：央视新闻联播文字稿 -> ETF 口径板块
#
# 用途：政策/时政支柱的唯一文本->板块映射（纯字符串匹配，无黑盒）。
# 匹配范围：新闻联播当日的全部 标题+正文；一条新闻命中某板块的任意关键词，
# 该板块当日政策强度 +1（按新闻条数去重，不按关键词出现次数累计）。
#
# 维护规则：
# - 板块代码为 ETF 口径 board_code（与情绪支柱一致，数据源
#   data/cache/board_list_etf.parquet）；词典中不存在的代码在计算时被忽略。
# - 关键词尽量用"政策语境高频词"而非公司名：如 半导体/芯片/集成电路、
#   人工智能/AI、低空经济/通用航空 等；宽基/纯风格指数（如 300非周、ESG、
#   小康指数）不设关键词——政策文本无法稳定映射。
# - 命中是"提及强度"的客观计数，不代表政策利好或利空方向；观察用途。
# - 本文件独立于 config.yaml（后者 SHA256 冻结），可自行增删词条。

